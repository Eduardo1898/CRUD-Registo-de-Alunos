name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar suporte gráfico
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Executar testes
        run: |
          xvfb-run -a python -c 'import tkinter as tk; janela = tk.Tk(); janela.destroy()'
          xvfb-run -a python -m unittest discover -s tests -v
