name: Pacote Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Construir pacote Windows
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Python (Get-Command python).Source
      - name: Armazenar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: StudentHub-v1.0.0-windows-x64
          path: dist/windows/StudentHub-v1.0.0-windows-x64.zip
          if-no-files-found: error
